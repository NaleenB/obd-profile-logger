name: OBDLogger
options:
  bundleIdPrefix: com.naleen
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"

packages:
  OBDCore:
    path: ../Core
  OBDLink:
    path: ../Link

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.22"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  OBDLogger-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
      - path: ../profiles/mitsubishi/outlander-2016-4n14.json
        buildPhase: resources
      - path: ../profiles/generic/iso15765-can.json
        buildPhase: resources
    dependencies:
      - package: OBDCore
        product: OBDCore
      - package: OBDLink
        product: OBDLink
    info:
      path: Info-macOS.plist
      properties:
        CFBundleName: OBDLogger
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "15.0"
        NSBluetoothAlwaysUsageDescription: OBDLogger connects to your OBD-II adapter over Bluetooth to read vehicle data.
        NSBluetoothPeripheralUsageDescription: OBDLogger connects to your OBD-II adapter over Bluetooth to read vehicle data.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naleen.obdlogger
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES

  OBDLogger-macOS-Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: OBDLogger-macOS
      - package: OBDCore
        product: OBDCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naleen.obdlogger.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

  OBDLogger-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: ../profiles/mitsubishi/outlander-2016-4n14.json
        buildPhase: resources
      - path: ../profiles/generic/iso15765-can.json
        buildPhase: resources
    dependencies:
      - package: OBDCore
        product: OBDCore
      - package: OBDLink
        product: OBDLink
    info:
      path: Info-iOS.plist
      properties:
        CFBundleName: OBDLogger
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
        UIRequiresFullScreen: false
        NSBluetoothAlwaysUsageDescription: OBDLogger connects to your OBD-II adapter over Bluetooth to read vehicle data.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naleen.obdlogger
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
