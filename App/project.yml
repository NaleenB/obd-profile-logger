name: OBDLogger
options:
  bundleIdPrefix: com.naleen
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"

packages:
  OBDCore:
    path: ../Core
  OBDLink:
    path: ../Link

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  OBDLogger-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: ../profiles/mitsubishi/outlander-2016-4n14.json
        buildPhase: resources
    dependencies:
      - package: OBDCore
        product: OBDCore
      - package: OBDLink
        product: OBDLink
    info:
      path: Info-macOS.plist
      properties:
        CFBundleName: OBDLogger
        LSMinimumSystemVersion: "15.0"
        NSBluetoothAlwaysUsageDescription: OBDLogger connects to your OBD-II adapter over Bluetooth to read vehicle data.
        NSBluetoothPeripheralUsageDescription: OBDLogger connects to your OBD-II adapter over Bluetooth to read vehicle data.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naleen.obdlogger
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES

  OBDLogger-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../profiles/mitsubishi/outlander-2016-4n14.json
        buildPhase: resources
    dependencies:
      - package: OBDCore
        product: OBDCore
      - package: OBDLink
        product: OBDLink
    info:
      path: Info-iOS.plist
      properties:
        CFBundleName: OBDLogger
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: OBDLogger connects to your OBD-II adapter over Bluetooth to read vehicle data.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naleen.obdlogger
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
